version: 2

goal:
  title: "Context Contract V1"
  slug: "context-contract-v1"
  kind: specific
  tranche: "Deliver language-independent V1 context contracts, fixtures, adapter guidance, and cross-language oracle verification."
  status: done
  oracle:
    signal: "The same canonical fixture corpus validates with identical expected outcomes in Python and a future TypeScript implementation."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipt-backed schema and fixture validation, including Python execution and a language-neutral oracle manifest suitable for TypeScript."
  intake:
    original_request: "Prepare goal context-contract-v1 for language-independent ContextRequestV1, ContextBundleV1, and ContextReceiptV1 contracts."
    interpreted_outcome: "The kit owns versioned schemas, non-duplicative rules, reusable fixtures, and adapter guidance without becoming a runtime service or hidden memory layer."
    input_shape: specific
    audience: "Kit maintainers and Python/TypeScript adapter implementers"
    authority: requested
    proof_type: test
    completion_proof: "Versioned schemas, valid/invalid examples, required smoke fixtures, and concise Python/TypeScript adapter guidance exist and the canonical fixtures have portable expected results."
    likely_misfire: "Creating a new runtime or restating governance rules inside schemas instead of referencing and reusing the existing policy sources."
    blind_spots_considered:
      - "Cross-language JSON Schema dialect and validator behavior must be pinned."
      - "Fixture failures need portable, stable expectations rather than validator-specific error strings."
      - "Stale authority semantics must reuse existing authority/version signals."
    existing_plan_facts:
      - "Reuse context_governance_helper.py."
      - "Reuse context_index.yaml."
      - "Reuse retrieval_policy.yaml and retrieval_scoring_policy.yaml."
      - "Reuse existing context-selection smoke cases."
      - "Do not create hidden agent memory."
      - "Do not duplicate existing rules."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/context-contract-v1/"
    command: "node \"C:/Users/Alexander Lozovoy/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs\" --goal docs/goals/context-contract-v1"

