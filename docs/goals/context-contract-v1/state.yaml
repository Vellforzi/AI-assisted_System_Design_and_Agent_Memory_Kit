      - "Do not edit implementation files."
      - "Identify canonical rule ownership and reusable data fields with exact file-path evidence."
    expected_output:
      - "Existing artifact map"
      - "Canonical rule ownership map"
      - "Current smoke verification commands"
      - "Schema and fixture integration points"
      - "Exact candidate paths for schemas, fixtures, adapter guide, and tests"
