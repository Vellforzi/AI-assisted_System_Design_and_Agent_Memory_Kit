name: Documentation governance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v2
      - name: Install optional site dependencies
        run: python -m pip install --requirement Agent\ Kit/kit/optional_integrations/documentation_governance/mkdocs/requirements-site.txt
      - name: Run the shared CI target
        run: just ci
