# Include or merge this optional job into the adopting project's .gitlab-ci.yml.
documentation-governance:
  image: python:3.12-slim
  variables:
    GIT_DEPTH: '0'
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends curl ca-certificates
    - curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://just.systems/install.sh | bash -s -- --to /usr/local/bin
    - python -m pip install --requirement 'Agent Kit/kit/optional_integrations/documentation_governance/mkdocs/requirements-site.txt'
  script:
    - just ci
