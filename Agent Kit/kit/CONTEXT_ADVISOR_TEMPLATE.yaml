schema_version: "1.0"
policy_id: "CONTEXT-ADVISOR-POLICY"
status: "starter_template"
purpose: "Pre-hydration context, scope, model, and settings advisor for Agent Memory Kit projects."

hint_policy:
  default_hint_mode: "silent"
  compact_hint_max_lines: 5
  show_compact_when:
    - "sufficiency_gate_is_amber_red_or_blocked"
    - "intent_is_apply_audit_repair_recover_or_cross_subsystem_debug"
    - "mandatory_context_missing"
    - "owner_asks_settings_scope_fuel_why_or_safe_apply"
    - "provider_capability_snapshot_missing_or_stale"
    - "max_mode_or_ide_context_setting_likely_wrong"
  expanded_only_on:
    - "settings?"
    - "scope?"
    - "fuel?"
    - "why?"
    - "safe apply?"
  do_not_show_by_default:
    - "raw_decision_trace"
    - "full_profile_matrix"
    - "large_context_inventory"
    - "provider_pricing_details"

blocking_triggers:
  - "secrets_requested_or_detected"
  - "db_write_without_owner_ok"
  - "deploy_without_owner_ok"
  - "project_map_write_without_owner_ask"
  - "product_code_edit_without_required_gate"
  - "duplicate_side_effect_risk"
  - "branch_lineage_ambiguous_for_mutation"

context_classes:
  mandatory_for_project_work:
    - "project_map_core"
    - "source_authority"
    - "memory_relevant"
  forbidden:
    - "secrets"

default_settings:
  max_mode: "off_first"
  include_ide_context: "off_unless_exact_open_files_are_scoped"
  plan_mode: "on_for_complex_apply_debug_audit"
  speed: "standard_for_risky_or_verification_heavy_work"
  reasoning: "medium_default_high_for_cross_subsystem_audit_repair_protocol_design"
  external_research: "only_when_requested_or_needed_for_volatile_external_facts"

working_state_refs:
  latest_trace_ref: null
  latest_context_needs_ref: null
  provider_capability_snapshot_ref: null


model_cost_policy:
  default: lowest_sufficient_model_first
  premium_requires:
    - escalation_trigger
    - cheaper_alternative
    - why_cheaper_is_insufficient
  routine_defaults:
    project_map_update: medium_standard
    owner_provided_facts: medium_standard
    version_refs: medium_standard
    formatting_cleanup: low_or_fast
