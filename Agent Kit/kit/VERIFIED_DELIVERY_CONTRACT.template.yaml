schema_version: "1.3"
task_id: "TASK-ID"
owner_goal: "Measurable owner-visible result"
allowed_change: []
protected_behavior: []
write_scope:
  allowed: []
  forbidden: []
acceptance_criteria:
  - id: "criterion_id"
    outcome: "Observable result"
    oracle_id: "oracle_id"
    mandatory: true
    owner_visible: false
    defect_id: "DEFECT-1"
oracles:
  - id: "oracle_id"
    kind: "command"  # one of: command, state, trace, diff, visual, owner; owner_acceptance requires owner
    evidence_class: "synthetic"  # one of: static, synthetic, runtime, owner
    # verification_level is required when verification_target is declared.
    # verification_level: "source_structure"
    authorized: true
    check: "Stable executable or inspectable check"
    pass_condition: "Unambiguous pass condition"
    evidence_ref: "receipt or artifact path"
stop_condition:
  - "Verified candidate or explicit terminal blocker"
lifecycle_policy:
  lifecycle_owner: primary_agent
  autonomous_within_scope: true
  resolve_discoverable_details_from_project_evidence: true
  owner_gate_only_for_material_choice_or_new_authority: true
  repair_only_confirmed_findings: true
  final_outcomes: [task_completed, task_blocked]

# Optional, selected by coupling/risk rather than filled with not_applicable.
risk_tier: "R1"
gate_profile:
  active:
    - targeted
    - scope_diff
    - finalization
extensions:
  dependency_neighborhood: []
  characterization: []
  baseline_regressions: []
  black_box: []
  environment_readiness: []
  build: {}
  deploy: {}
  rollback_readback: []
  independent_review: {}
  unresolved_external_conditions: []
repair_policy:
  complexity_class: simple
  max_total_iterations: 1
  max_same_failure_repeats: 2
  max_no_progress_iterations: 2
  terminal_triggers:
    - same_deterministic_failure_repeated
    - two_no_progress_iterations
    - scope_or_capability_expansion_required
    - external_dependency_unavailable
    - oracle_missing_or_contradictory
    - owner_goal_or_protected_behavior_change_required
    - total_repair_budget_exhausted
    - authorization_or_integrity_gate
metrics_policy:
  enabled: false
  record_only_measured_values: true

# Conditional controls activate from task shape; inactive controls remain compact.
conditional_controls:
  task_shape:
    kind: implementation  # simple, implementation, diagnostic, repair, runtime, owner_visible
    product_mutation: false
    coupled: false
    high_risk: false
  defect_decomposition:
    strategy: single  # single, separate_task_units, explicit_coupling
    coupling_justification: ""
    units:
      - id: "DEFECT-1"
        root_cause: "Single bounded implementation unit"
        criterion_ids: ["criterion_id"]
        oracle_ids: ["oracle_id"]
  forensic_before_code:
    required: false
    first_divergent_event: ""
    execution_sequence_ref: ""
    falsifiable_hypothesis: ""
    oracle_id: ""
  preimplementation_architecture_review:
    required: false
    reviewer_role_id: ""
    evidence_ref: ""
    covers: []
    reuse_role_for_final_review: false
  diff_budget:
    max_product_files: 3
    max_product_lines: 300
    product_path_patterns: []
    task_local_framework_patterns: []
    planned_task_local_framework_patterns: []
    replan_on_unplanned_task_local_framework: true
  verification_escalation:
    narrow_oracle_ids: ["oracle_id"]
    targeted_after_narrow_pass: true
    integration_or_dependency_risk: false
    full_suite_trigger: final_integration_or_dependency_risk
  runner_reuse:
    registered_runners_required: true
    task_local_replacement_only_for_capability_gap: true
  runtime_acceptance:
    required: false
    authorized: false
    available: false
    owner_gate: ""

