schema_version: 1.1.0
snapshot_id: provider-capability-example-YYYY-MM-DD
status: volatile_example_not_current_evidence
collected_at: 'YYYY-MM-DDTHH:MM:SSZ'
expires_at: 'YYYY-MM-DDTHH:MM:SSZ'
purpose: Keep public docs, local capability evidence, owner intake, and project routing decisions separate.

source_classes:
  official_public_documentation:
    authority: public_product_claims
    refs:
    - id: PROVIDER-DOC-EXAMPLE
      type: official_documentation
      url: https://provider.example/models
      checked_at: YYYY-MM-DD
      supports:
      - public role or control documented by the provider
  owner_local_capability_evidence:
    authority: current_owner_environment_only
    refs:
    - id: OWNER-LOCAL-CAPABILITY-EXAMPLE
      type: generated_local_capability_cache
      fetched_at: 'YYYY-MM-DDTHH:MM:SSZ'
      supports:
      - exact local label, slug, context, effort, or speed control
      limitations:
      - does not establish universal availability
  owner_intake:
    authority: intake_seed_only
    refs:
    - id: OWNER-ANSWER-EXAMPLE
      type: owner_provided_agent_answer
      role: verify before adoption
  project_policy:
    authority: routing_decision_only
    note: Project guidance is not a provider benchmark.

models:
  example_model:
    display_label: Provider Model Label
    config_slug: provider-model-slug
    official_public_role: documented_role
    local_supported_reasoning:
    - low
    - medium
    - high
    local_context_tokens: null
    local_fast:
      supported: null
      description: null
    public_credit_rate_per_1m_tokens:
      input: null
      cached_input: null
      output: null

structured_settings_tuple:
  internal_surface_id: provider_surface
  surface_display_label: Provider surface label
  work_mode: owner_scoped
  model_display_label: Provider Model Label
  model_config_slug: provider-model-slug
  reasoning_effort: medium
  speed: standard
  snapshot_ref: provider-capability-example-YYYY-MM-DD

owner_prompt_tuple:
  surface: Provider surface label
  model: Provider Model Label
  reasoning: medium
  speed: Standard

control_boundaries:
- Keep display label, config slug, and reasoning effort separate.
- Keep single-task reasoning Max separate from Cursor Max Mode context/capacity.
- Treat Ultra as delegation only when independent subscopes exist.
- Standard is the safe default speed.
- Fast is latency-first and increased-usage; never describe it as cheaper without evidence.
- Do not invent a fixed speed multiplier, credit multiplier, context size, or availability claim.
- Capability evidence for one surface does not establish availability on another surface.
- Owner-facing prompt tuples include only controls actually selected before prompt submission on that surface; policy and application configuration remain separate.

refresh_triggers:
- exact model or settings advice is requested
- provider documentation changes
- local capability cache changes
- snapshot expires
