routing_rules:
- task_class: project_map_update
  default_model: composer_2_5
  fallback_models:
  - gpt_5_5
  - sonnet_4_6
  default_settings: Fast OFF, Medium/standard if model supports reasoning/effort, Max OFF, IDE Context OFF, Plan OFF
  escalation_only_if:
  - Project Map schema/index corruption
  - memory conflict or stale fact repair
  - root-router/eval/agent-behavior policy change
- task_class: agent_kit_patch
  default_model: composer_2_5 for mechanical merge; gpt_5_5 medium/high for behavior/schema/eval contracts
  fallback_models:
  - codex_5_3
  - sonnet_4_6
  default_settings: Plan ON for design/contract pass, then Plan OFF for accepted apply; Max OFF first
- task_class: code_repair_loop
  default_model: codex_5_3
  fallback_models:
  - gpt_5_5
  - sonnet_4_6
  default_settings: Medium first; High only for failing tests or multi-step root cause; Fast OFF
- task_class: premium_audit_or_emergency
  default_model: gpt_5_5 or sonnet_4_6 first
  fallback_models:
  - opus_4_8
  - fable_5
  default_settings: Premium models require explicit escalation trigger and cheaper alternative
refresh_triggers:
- Before adding/removing models from routing
- Before using 1M context or Max Mode
- Before recommending Fast as cost-saving or cost-expensive
- When Cursor model picker labels/options change
- When official Cursor pricing/model docs change
- At least monthly for active projects
optional_model_policy:
