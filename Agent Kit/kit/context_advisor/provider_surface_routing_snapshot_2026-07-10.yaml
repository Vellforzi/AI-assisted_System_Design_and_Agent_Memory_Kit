quality_biased_alternative:
  model: GPT-5.6-Sol
  model_slug: gpt-5.6-sol
  reasoning_effort: medium
  use_when: Extra quality or polish matters enough to justify Sol over the AMK cost-aware Terra default.

control_boundaries:
- Exact display label and config slug are separate from reasoning effort.
- Cursor Max Mode is context/capacity semantics; Codex Max is single-task reasoning depth.
- Ultra is delegation semantics, not a generic stronger default.
- Luna Ultra is unsupported by the 2026-07-10 local capability snapshot.
- Standard is the default speed.
- Fast is latency-first and increased-usage, never cheaper.
- No fixed GPT-5.6 Fast credit multiplier is established by current public evidence.
- GPT-5.6 Codex availability does not establish GPT-5.6 Cursor availability.
- ChatGPT desktop Codex, Codex IDE extension, Codex CLI, and Codex web are distinct clients.
- Owner-facing ChatGPT Codex recommendations omit derived off states, IDE context, shell, terminal profile, and application configuration.

refresh_triggers:
- Cursor model picker or current Cursor documentation is rechecked.
- Codex model labels, effort choices, speed support, or rate card changes.
- Provider UI changes control labels.
- This snapshot reaches expires_at.
