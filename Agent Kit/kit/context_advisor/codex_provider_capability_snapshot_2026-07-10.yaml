      checked_at: '2026-07-10'
      supports:
      - The new ChatGPT desktop app combines Chat, Work, and Codex in one app.
      - Codex is the software-development mode in the ChatGPT desktop app.
    - id: OPENAI-CODEX-CHATGPT-CLIENTS-2026-07-10
      type: official_openai_help
      title: Using Codex with your ChatGPT plan
