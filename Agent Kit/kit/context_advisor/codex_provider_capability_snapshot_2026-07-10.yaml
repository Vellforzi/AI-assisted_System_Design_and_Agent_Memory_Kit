      title: Previewing GPT-5.6 Sol
      url: https://openai.com/index/previewing-gpt-5-6-sol/
      checked_at: '2026-07-10'
      supports:
      - Sol is the flagship model, Terra is balanced for everyday work, and Luna is fast and affordable.
      - Terra is described as competitive with GPT-5.5 at 2x lower price.
      - Max increases single-task reasoning depth and Ultra uses subagents.
      - Public API token prices for Sol, Terra, and Luna.
    - id: OPENAI-CODEX-MODELS-2026-07-10
      type: official_openai_documentation
      title: Models for Codex
      url: https://learn.chatgpt.com/docs/models
      checked_at: '2026-07-10'
      supports:
      - Config slugs gpt-5.6-sol, gpt-5.6-terra, and gpt-5.6-luna.
      - Sol for complex open-ended work, Terra for everyday work, and Luna for clear repeatable work.
      - Max is deeper single-task reasoning; Ultra is parallel work through subagents.
      - Most tasks do not need Max or Ultra.
    - id: OPENAI-CODEX-SUBAGENTS-2026-07-10
      type: official_openai_documentation
      title: Codex subagents
      url: https://learn.chatgpt.com/docs/agent-configuration/subagents
      checked_at: '2026-07-10'
      supports:
      - Codex delegates independent work when explicitly requested or when applicable project or skill instructions request it.
      - Ultra can proactively delegate suitable independent work.
    - id: OPENAI-CODEX-SPEED-2026-07-10
      type: official_openai_documentation
      title: Codex speed
      url: https://learn.chatgpt.com/docs/agent-configuration/speed
      checked_at: '2026-07-10'
      supports:
      - Fast is latency-first and consumes credits faster than Standard.
      - The checked public page explicitly lists GPT-5.5 and GPT-5.4, not GPT-5.6.
    - id: OPENAI-CODEX-RATE-CARD-2026-07-10
      type: official_openai_help
      title: Codex rate card
      url: https://help.openai.com/en/articles/20001106-codex-rate-card-2
      checked_at: '2026-07-10'
      supports:
      - GPT-5.6 Sol credit rates are 125 input, 12.5 cached input, and 750 output per 1M tokens.
      - GPT-5.6 Terra credit rates are 62.5 input, 6.25 cached input, and 375 output per 1M tokens.
      - GPT-5.6 Luna credit rates are 25 input, 2.5 cached input, and 150 output per 1M tokens.
    - id: OPENAI-CHATGPT-DESKTOP-CODEX-INTEGRATION-2026-07-09
