amk_policy_decisions:
- Use the lowest sufficient model and effort.
- Luna Low/Medium is the default for clear extraction, inventory, classification, and repeatable static checks.
- Terra Medium/Standard is the default for routine analysis, planning, contract work, review, and bounded repair.
- Terra High or Sol High is appropriate for difficult repair or ambiguous root cause.
- Sol High/XHigh is appropriate for hooks, routing, schemas, evals, protocols, and cross-system or production-risk recovery.
- Sol Max requires one hardest sequential problem and an explicit trigger.
- Sol/Terra Ultra requires meaningfully independent subscopes, stop conditions, and fuel justification.
- These routes are AMK guidance, not an OpenAI universal benchmark.
- Owner-facing ChatGPT Codex recommendations show only the selectable prompt tuple: surface, model, reasoning effort, and speed.

refresh_triggers:
- Public Codex model, speed, subagent, or rate-card documentation changes.
- Local Codex model cache changes labels, slugs, effort choices, context, or Fast support.
- Owner asks for current Cursor availability or pricing.
- This snapshot reaches expires_at.
