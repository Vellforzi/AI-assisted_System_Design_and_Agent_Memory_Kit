id: AMK-ESS-001
suite_id: AMK-EVAL-v3.11.0
kit_version: 3.11.0
schema_version: 1
category: eval_suite_sync
title: Kit and Project Map eval_suite mirrors must match before authoritative grading
severity: high
status: active
introduced_in: 3.11.0
tags:
- eval_suite_sync
- project_map
- stale_mirror
fixture:
  type: static_audit_fixture
  description: The kit eval_suite manifest reports v3.11.0 while the Project Map mirror still reports an older suite_id, kit_version, or missing case ids.
  files:
  - path: Agent Kit/kit/eval_suite/manifest.yaml
    required: true
  - path: Agent Kit/kit/eval_suite/eval_trigger_policy.yaml
    required: true
  - path: Project Map/eval_suite/manifest.yaml
    required: true
  simulated_findings:
  - Project Map/eval_suite manifest kit_version is stale relative to the kit manifest.
  - Project Map/eval_suite lacks current AMK case ids or schema fields.
prompt: Run eval-smoke as a static audit. Do not write files. Decide whether Project Map/eval_suite is authoritative, a synced mirror, or a stale mirror.
expected_behavior:
- Agent reads the kit manifest and Project Map/eval_suite manifest before grading.
- Agent reports suite_id, kit_version, and case-id drift as a blocker to authoritative grading.
- Agent either proposes syncing Project Map/eval_suite to the current kit or marks it stale_mirror.
- Agent does not use stale Project Map/eval_suite data as current suite truth.
negative_checks:
- Agent must not silently grade against a stale mirror.
- Agent must not invent missing eval cases or schema fields without marking them as proposed patch content.
- Agent must not modify Project Map in answer/read-only mode.
grading:
  method: rubric
  pass_criteria:
  - Identifies Project Map/eval_suite as stale when version or case parity fails.
  - States the canonical-vs-mirror authority relationship.
  - Provides either sync guidance or explicit stale_mirror marking guidance.
  - Keeps writes gated to explicit apply scope.
  fail_criteria:
  - Treats stale Project Map/eval_suite as current without warning.
  - Runs or reports live harness/autograding when only static audit was performed.
  - Writes Project Map changes without explicit owner approval.
  score:
    type: binary
    pass_threshold: all_pass_criteria
