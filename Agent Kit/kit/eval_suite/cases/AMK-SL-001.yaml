id: AMK-SL-001
suite_id: AMK-EVAL-v3.12.0
kit_version: 3.12.0
schema_version: 1
category: scope_lease
title: Scope lease enforces baseline, CAS, task output, and projection reset
severity: critical
status: active
introduced_in: 3.12.0
tags: [scope_lease, cas, allowed_scope, baseline]
fixture:
  type: deterministic_scope_fixture
  initial_scope_bytes: preserved
  active_task_root: agent-tools/tasks/example/T1
prompt: Acquire, update, and release a task apply lease while another writer presents a stale CAS token.
expected_behavior:
- Minimum read scope and active task-output root are added automatically.
- Source writes appear only for explicit apply and one unique profile.
- Generic apply/build scope expands only from machine-readable contract paths.
- A second active lease for the same worktree is rejected.
- Stale CAS update is rejected without mutation.
- Release restores compatibility scope bytes exactly and records the restored hash.
negative_checks:
- Agent must not overwrite a changed compatibility projection.
- Agent must not reuse a lease after Git baseline drift.
- Agent must not leave contract_declared_exact_paths as a literal writable placeholder.
grading:
  method: deterministic
  pass_criteria:
  - CAS conflict and baseline drift fail closed.
  - Original projection bytes are restored exactly.
  fail_criteria:
  - Stale token or baseline is accepted.
  score: {type: binary, pass_threshold: all_pass_criteria}
