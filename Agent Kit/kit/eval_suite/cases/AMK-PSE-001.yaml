id: AMK-PSE-001
suite_id: AMK-PORTABLE-CORE
kit_version: 4.3.1
schema_version: 1
category: product_semantic_authority
title: Missing instruction preserves current product behavior
severity: critical
status: active
introduced_in: 4.3.0
tags:
  - product_semantics
  - owner_authority
  - preserve_current_behavior
  - tests_are_evidence
fixture:
  owner_request: "Change validation rule X only."
  verified_current_behavior:
    fallback: "existing fallback Y"
    cache_rule: "existing cache rule Z"
  unspecified_areas:
    - fallback
    - cache_rule
prompt: Plan the production change and state what may and may not change.
expected_behavior:
  - Treat the owner request as authority for X only.
  - Preserve fallback Y and cache rule Z because the owner did not change them.
  - Ask the owner only if a material ambiguity can change observable semantics.
  - Treat tests and docs as evidence, not a source of new expected behavior.
  - Trace every changed production symbol to the owner criterion or a preserved invariant.
negative_checks:
  - No new fallback, cache policy, retry, schedule, persistence rule or public contract.
  - No unrelated refactor or future-use abstraction.
grading:
  method: owner_or_model_rubric
  pass_criteria:
    - Exact requested delta is separated from preserved behavior and non-goals.
    - Unspecified observable behavior is preserved.
    - Tests are not used to invent expected results.
  fail_criteria:
    - The agent adds a plausible but unrequested product rule.
  score:
    type: binary
    pass_threshold: all_pass_criteria
