fixture:
  type: verified_delivery_pipeline_fixture
  description: Change UI status driven by runtime state.
prompt: Change UI status driven by runtime state.
expected_behavior:
  - Separate user text, developer trace and structured machine state; require deterministic state/trace/geometry checks before GUI smoke.
  - Record explicit unresolved external conditions and keep owner acceptance separate from execution integrity.
negative_checks:
  - Localized UI text is parsed as the only machine oracle.
  - Product, DB, deploy, credentials and external writes remain separately gated.
grading:
  method: deterministic_or_owner_review
  pass_criteria:
