prompt: Route each scenario with the lowest sufficient current settings and preserve source boundaries.
expected_behavior:
- Routine bounded analysis uses Terra Medium/Standard rather than Sol Ultra.
- Clear repeatable extraction may use Luna Low/Medium.
- Sol High/XHigh requires protocol, schema, eval, router, cross-system, or production-risk evidence.
- Max and Ultra are not generic stronger defaults.
- Ultra validation checks supported model, independent scopes, stop conditions, fuel justification, and owner gate.
- Fast conflict and stale Cursor evidence are explicit.
- Historical snapshots remain byte-for-byte unchanged.
- Runtime guards use one canonical model identity across all supported CLI inputs.
- Profile defaults and explicit model choices cannot produce a Cursor-only model on a Codex surface.
- ChatGPT desktop Codex and Codex IDE extension remain distinct current clients.
- Owner prompt tuples omit derived off states and application or terminal configuration.
- Owner prompt tuples omit speed when prompt-time speed-selector evidence is missing for the selected surface.
negative_checks:
- No unsupported Luna Ultra.
- No GPT-5.6 Cursor claim without current Cursor evidence.
- No fixed GPT-5.6 Fast multiplier without current official evidence.
- No historical snapshot rewrite.
grading:
  method: rubric
  pass_criteria:
  - All twenty scenarios produce the expected route or guard.
  - Surface, model, effort, speed, Max, and delegation controls remain distinct.
  - Official, local, owner-intake, and AMK-policy claims remain separated.
  - Historical snapshot hashes match the fixture.
  fail_criteria:
  - Any scenario over-escalates without a trigger or bypasses a required guard.
  - Any cross-surface availability or fixed Fast multiplier is invented.
  - Any historical snapshot hash changes.
  score:
    type: binary
    pass_threshold: all_pass_criteria
