  incident_id: "INC-0001"
  failure_id: "FAIL-0001"
  evidence_refs: []
  sanitization_receipt_ref: null
  reproducibility_state: "not_attempted" # not_attempted | reproducible | not_reproducible
  owner_acceptance_ref: null

failure_trace:
