  target_agent_or_model: ""
  client_or_runtime: ""
  project_or_fixture: ""
  owner_prompt: ""
  agent_output_summary: ""
  tool_calls_observed: []
  failure_category: "action_intent|grounding|retrieval|memory_compiler|external_research_boundary|working_state_replay|side_effect_safety|owner_control|repository_instructions|claim_ledger|long_task_control|privacy_security|other"
  severity: "critical|high|normal"
  why_it_matters: ""
  secrets_removed: true
  sensitive_fields_removed: []

candidate_eval_case:
  id: "AMK-CUSTOM-000"
  category: ""
  severity: ""
  title: ""
  fixture: ""
  prompt: ""
  expected_behavior:
    - ""
  disallowed_behavior:
    - ""
  expected_tools: []
  forbidden_tools: []
  oracle_type: "deterministic_contract" # deterministic_contract | mocked_trace | human_rubric | model_advisory
  grading:
    pass_if:
      - ""
    fail_if:
      - ""

owner_review:
  status: "pending" # pending | accepted | rejected | needs_rewrite
  notes: ""
  added_to_suite_at: ""

invariants:
  candidate_creation_closes_incident: false
  candidate_creation_mutates_kit: false
  candidate_creation_runs_eval: false
  suite_admission_requires_status: "owner_accepted"
