version_invariants:
  required_kit_version: 4.1.0
  required_suite_id: AMK-EVAL-v4.1.0
  inherited_case_metadata_note: Older case files may keep their introduced suite_id and kit_version until a separate eval metadata normalization task is approved. The checklist runner must not fail smoke validation solely because an inherited case file reports an older suite_id or kit_version when this note is present.
  runner_metadata_rule: validate required schema fields on every listed case; compare manifest kit_version and suite_id only against eval_trigger_policy.yaml; skip per-case suite_id/kit_version equality checks when inherited_case_metadata_note is set.
  case_schema_required_fields:
  - id
  - suite_id
  - kit_version
  - schema_version
  - category
  - title
  - severity
  - fixture
  - grading
