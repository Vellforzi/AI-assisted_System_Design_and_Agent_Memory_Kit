release_date: '2026-07-05'
release_type: minor_feature
label: Agent Memory Kit v3.11.0 executor routing, connector, hook, shell, and retrieval suite
authority:
  canonical_path: Agent Kit/kit/eval_suite
  project_map_mirror_path: Project Map/eval_suite
  project_map_authority_state: synced_mirror
  stale_mirror_rule: Project Map/eval_suite may be used as current only when its manifest suite_id, kit_version, and case ids match the canonical Agent Kit/kit/eval_suite manifest. If not matched, mark Project Map/eval_suite as stale_mirror and do not use it as authoritative grading input.
