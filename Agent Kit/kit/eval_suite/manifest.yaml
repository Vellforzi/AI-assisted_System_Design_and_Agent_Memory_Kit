suite_id: AMK-EVAL-v4.1.0
kit_version: 4.1.0
manifest_version: 4.1.0
release_date: '2026-08-13'
release_type: minor_release
label: Agent Memory Kit v4.1.0 authorship surface and host-plugins guide
authority:
  canonical_path: Agent Kit/kit/eval_suite
  project_map_mirror_path: Project Map/eval_suite
  project_map_authority_state: synced_mirror
  stale_mirror_rule: Project Map/eval_suite may be used as current only when its manifest suite_id, kit_version, and case ids match the canonical Agent Kit/kit/eval_suite manifest. If not matched, mark Project Map/eval_suite as stale_mirror and do not use it as authoritative grading input.
smoke_policy_path: eval_trigger_policy.yaml
checklist_runner: ../tools/run_eval_checklist.py
categories:
- id: context_advisor
  description: Context Advisor preflight/read-order behavior and stale mirror detection.
- id: cursor_integration
  description: Live Cursor rule/command adoption checks for .cursor/rules and .cursor/commands.
- id: eval_suite_sync
  description: Parity between Agent Kit/kit/eval_suite and Project Map/eval_suite mirrors.
- id: model_escalation
  description: Lowest-sufficient route and concrete escalation trigger policy.
- id: context_compaction_control
  description: Owner-gated context compaction, structured summary, tool-output clearing, and recovery behavior.
- id: shell_reliability_gate
  description: Shell health gate and hard-fail transport policy for shell-dependent PASS/commit decisions.
- id: model_setting_label_fidelity
  description: Exact owner/provider UI label usage for model/settings tuple with contradiction prevention.
- id: gpt_project_sources
  description: Local deterministic ChatGPT Project sources manifest workflow without UI automation.
- id: executor_routing
  description: Evidence-based executor routing gate for non-trivial task contracts and bootstraps.
- id: windows_encoding_hygiene
  description: Windows-safe shell, quoting, encoding, and readback behavior.
- id: hook_recovery
  description: Hook denial payload handling and answer/analyze read-only semantics.
- id: connector_side_effects
  description: Connector read/write separation, draft-first outbound behavior, and receipt gates.
- id: generated_retrieval_evidence
  description: Generated search/index/cache output as candidate evidence requiring canonical source readback.
- id: capability_management
  description: Constraint contour vs model IQ; behavioral oracles vs structural unit tests; owner smoke remains a human gate.
- id: durable_truth
  description: Durable truth is an owner-assigned role; checkout and git-as-pile are not truth; do not demote the map.
- id: host_plugins
  description: PStack, Cursor plugins, and Codex skills are host add-ons, not kit identity or Project Map truth.
- id: execution_profile
  description: Unique mode + task class + path zone route, toolchain, and write lock.
- id: path_zone_safety
  description: Most-specific path zone; secrets/backups/unknown fail closed.
- id: scope_lease
  description: Baseline-bound CAS mutation lease.
- id: archive_provenance
  description: Commit parity from Git blobs; worktree ZIP is not commit_parity.
- id: mode_routing
  description: Stage/review/recover/map mutation boundaries.
- id: lean_control
  description: Proportional R0-R4 control without dropping fail-closed gates.
- id: windows_command_launcher
  description: Registered interpreter, structured argv, no file-association launch.
- id: runtime_acceptance
  description: Orchestration completion is not runtime or owner acceptance.
- id: codex_desktop_orchestration
  description: Root ownership, read-only lanes, one writer, reset-before-reopen.
- id: verified_delivery
  description: Conditional verified-delivery pipeline, oracles, and receipts.
