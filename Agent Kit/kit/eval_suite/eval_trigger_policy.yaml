suite_id: AMK-EVAL-v3.11.3
kit_version: 3.11.3
policy_version: 3.11.3
release_date: '2026-08-12'
label: AMK v3.11.3 capability-management smoke policy
source_of_truth:
  policy_file: eval_trigger_policy.yaml
  runner_contract: run_eval_checklist.py must read smoke categories from this file and must not maintain an independent hardcoded smoke-category list.
smoke_policy:
  categories:
    context_advisor:
      required: true
      min_cases: 1
      rationale: Context Advisor is a live preflight surface and must be smoke-tested.
    cursor_integration:
      required: true
      min_cases: 1
      rationale: Live rule and command adoption must be checked.
    eval_suite_sync:
      required: true
      min_cases: 1
      rationale: Project Map/eval_suite must either sync to kit or be marked stale_mirror.
    model_escalation:
      required: true
      min_cases: 2
      rationale: Model escalation must be trigger-based and not delegated to the user.
    context_compaction_control:
      required: true
      min_cases: 3
      rationale: Long-running agent sessions must control compaction, summaries, and tool-output bloat without promoting summaries to project truth.
    shell_reliability_gate:
      required: true
      min_cases: 1
      rationale: Shell-dependent PASS or commit decisions must begin with a reliable health gate and fail hard on unknown transport results.
    model_setting_label_fidelity:
      required: true
      min_cases: 2
      rationale: Model/settings prompts must use exact owner/provider UI labels with no invented or contradictory tuples.
    gpt_project_sources:
      required: true
      min_cases: 1
      rationale: ChatGPT Project sources manifest workflow must stay local, deterministic, and manual in the UI.
    executor_routing:
      required: true
      min_cases: 1
      rationale: Non-trivial task contracts and bootstraps must include evidence-based executor routing.
    windows_encoding_hygiene:
      required: true
      min_cases: 1
      rationale: Windows shell and text mutation failures are high-risk for silent file corruption.
    hook_recovery:
      required: true
      min_cases: 1
      rationale: Hook denials must produce actionable recovery instead of vague blocked responses.
    connector_side_effects:
      required: true
      min_cases: 1
      rationale: Connector reads and writes are side-effect surfaces and must be owner-scoped.
    generated_retrieval_evidence:
      required: true
      min_cases: 1
      rationale: Generated retrieval output must remain candidate evidence until canonical readback.
    capability_management:
      required: true
      min_cases: 1
      rationale: Missing constraint contour must not be blamed on model IQ; AMK-CM-001 is required smoke.
  selection_rule: A case is selected for smoke when case.category is present in smoke_policy.categories or a case tag matches one of those categories.
  failure_rule: Smoke validation fails if any required category has fewer than min_cases selected cases, if any selected case lacks required schema fields, or if suite_id/kit_version drift is detected.
trigger_matrix:
  on_eval_suite_manifest_change:
    smoke_categories:
    - eval_suite_sync
    - context_advisor
    - context_compaction_control
    - shell_reliability_gate
    - model_setting_label_fidelity
    - executor_routing
  on_eval_trigger_policy_change:
    smoke_categories:
    - eval_suite_sync
    - context_advisor
    - cursor_integration
    - model_escalation
    - context_compaction_control
    - shell_reliability_gate
    - model_setting_label_fidelity
    - executor_routing
  on_context_advisor_rule_change:
    smoke_categories:
    - context_advisor
    - cursor_integration
    - context_compaction_control
    - shell_reliability_gate
    - model_setting_label_fidelity
  on_cursor_rule_or_command_change:
    smoke_categories:
    - cursor_integration
    - context_advisor
    - context_compaction_control
    - shell_reliability_gate
    - model_setting_label_fidelity
  on_model_route_or_router_change:
    smoke_categories:
    - model_escalation
    - context_advisor
    - model_setting_label_fidelity
    - executor_routing
  on_shell_workflow_change:
    smoke_categories:
    - shell_reliability_gate
    - windows_encoding_hygiene
    - context_advisor
  on_model_settings_prompt_change:
    smoke_categories:
    - model_setting_label_fidelity
    - model_escalation
    - context_advisor
  on_provider_model_snapshot_change:
    smoke_categories:
    - model_escalation
    - model_setting_label_fidelity
    - context_advisor
    - executor_routing
  on_context_compaction_policy_change:
    smoke_categories:
    - context_compaction_control
    - context_advisor
    - eval_suite_sync
  on_project_map_eval_suite_change:
    smoke_categories:
    - eval_suite_sync
    - context_advisor
    - context_compaction_control
  on_gpt_project_sources_workflow_change:
    smoke_categories:
    - gpt_project_sources
    - eval_suite_sync
    - context_advisor
  on_executor_routing_gate_change:
    smoke_categories:
    - executor_routing
    - model_escalation
    - owner_control
    - context_advisor
  on_hook_recovery_change:
    smoke_categories:
    - hook_recovery
    - side_effect_safety
    - context_advisor
  on_connector_policy_change:
    smoke_categories:
    - connector_side_effects
    - side_effect_safety
    - owner_control
  on_encoding_hygiene_change:
    smoke_categories:
    - windows_encoding_hygiene
    - shell_reliability_gate
  on_generated_retrieval_policy_change:
    smoke_categories:
    - generated_retrieval_evidence
    - retrieval
    - context_advisor
adoption_policy:
  project_map_eval_suite:
    allowed_states:
    - synced_mirror
    - stale_mirror
    current_patch_state: synced_mirror
    stale_marker_required_when_unsynced: true
    stale_marker_fields:
    - 'manifest.authority.project_map_authority_state: stale_mirror'
    - README.md stale_mirror_notice
  live_cursor:
    required_rule_paths:
    - .cursor/rules/context_advisor_preflight.mdc
    required_command_globs:
    - .cursor/commands/*
    rule_source_path: Agent Kit/kit/cursor_integration/rules/context_advisor_preflight.mdc
    command_source_path: Agent Kit/kit/cursor_integration/commands/
