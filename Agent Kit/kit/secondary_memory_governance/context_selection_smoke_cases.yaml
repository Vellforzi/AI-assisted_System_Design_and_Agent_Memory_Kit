schema_version: "1.0"
suite_id: "SMG-CONTEXT-SMOKE-001"
suite_name: "Secondary Memory Governance Context-Selection Smoke Cases"
status: "template"
purpose: "Check that the context helper follows task-local scope, source authority, trigger-only context, and high-risk exclusions."

instructions:
  - "Copy to docs/project_map/eval_suite/context_selection_smoke_cases.yaml."
  - "Replace placeholder paths with target-project paths."
  - "Run with: python scripts/ai_context_helper.py smoke-check --format json"

cases:
  - id: "startup_read_set"
    task: "Start a fresh project session."
    profile: "startup"
    max_sources: 8
    include_triggered: false
    required_paths:
      - "AGENTS.md"
      - "docs/NEXT_STEPS.md"
      - "docs/source_of_truth_hierarchy.md"
      - "docs/context_packs/current_status.md"
    forbidden_paths:
      - "docs/project_map/current_map.md"

  - id: "docs_only_scope"
    task: "Docs-only: clarify a context governance rule."
    profile: "docs_governance"
    max_sources: 12
    include_triggered: false
    required_paths:
      - "AGENTS.md"
      - "docs/source_of_truth_hierarchy.md"
      - "docs/context_governance_rules.md"
    forbidden_paths:
      - "docs/project_map/current_map.md"

  - id: "review_scope"
    task: "Review these local changes for risks."
    profile: "review"
    max_sources: 12
    include_triggered: false
    required_paths:
      - "AGENTS.md"
      - "docs/source_of_truth_hierarchy.md"
    forbidden_paths:
      - "data/example.db"

  - id: "project_map_memory_update"
    task: "Memory-update: apply this approved Project Map delta."
    profile: "project_map_governance"
    max_sources: 16
    include_triggered: true
    required_paths:
      - "AGENTS.md"
      - "docs/source_of_truth_hierarchy.md"
      - "docs/project_map/README.md"
      - "docs/project_map/source_authority.yaml"
      - "docs/project_map/permissions_policy.yaml"
      - "docs/project_map/retrieval_policy.yaml"
      - "docs/project_map/working_state.yaml"
    forbidden_paths: []

  - id: "research_stays_bounded"
    task: "Research a product or domain question."
    profile: "research"
    max_sources: 12
    include_triggered: false
    required_paths:
      - "AGENTS.md"
      - "docs/source_of_truth_hierarchy.md"
      - "docs/research/README.md"
    forbidden_paths:
      - "docs/project_map/current_map.md"
