# docs/project_map/memory/raw_sources/tool_outputs/index.yaml
# Compact reference template for long tool outputs.

schema_version: "1.0"
package_profile: "secondary_memory_governance"
project_id: "ai-stock-analyst-class"
last_updated: "2026-06-13"

core_rule: "Long raw tool outputs are evidence references, not always-loaded Project Map current truth."

tool_output_reference:
  id: "TO-0001"
  created_at: "<YYYY-MM-DDTHH:MM:SSZ>"
  source_tool: "<tool-or-command-name>"
  command_or_operation: "<sanitized command or operation>"
  scope: "<repo-or-folder>"
  full_output_ref: "docs/project_map/memory/raw_sources/tool_outputs/TO-0001.txt"
  excerpt:
    summary: "<short evidence summary>"
    relevant_ranges:
      - "<line-or-byte-range>"
  byte_count: 0
  retention_policy: "keep_until_task_closed"
  sensitivity: "normal"
  linked_task: "<TASK-0001 or null>"

rules:
  raw_output_not_current_truth: true
  store_sanitized_excerpts_in_memory: true
  do_not_store:
    - secrets
    - tokens
    - private_account_ids
    - raw_broker_payloads
    - raw_user_private_data
  sensitive_output_behavior: "Store only digest or summary and state the limitation."

