# docs/project_map/context_index.yaml
# Machine-readable context routing metadata for task-local AI/Codex work.

schema_version: "1.0"
package_profile: "secondary_memory_governance"
project_id: "<project-id>"
status: "active_baseline"
last_updated: "<YYYY-MM-DD>"
runtime_impact: "none"
authority: "Navigation metadata only; subordinate to AGENTS.md, source_of_truth_hierarchy.md, NEXT_STEPS, and operational source-of-truth docs."
purpose: "Route agents toward conservative P0/P1 documentation read sets without promoting the whole repository into default context."

safe_defaults:
  unindexed_docs: "Accessible through targeted repository search, but not silently promoted into startup or default task context."
  project_map_role: "Secondary memory and navigation only; operational docs win on conflicts."
  default_scope_gate: "Apply the current owner/user task before falling back to any global next step."
  no_hidden_memory: "Do not use this index to create hidden persistent memory, hooks, MCP servers, vector stores, or background capture."

excluded_by_default:
  path_globs:
    - "data/**"
    - "output/**"
    - ".env"
    - ".env.*"
    - "**/.env"
    - "**/.env.*"
    - "**/*.sqlite"
    - "**/*.sqlite3"
    - "**/*.db"
    - "**/*.log"
    - ".git/**"
    - ".venv/**"
    - "**/__pycache__/**"
    - "**/.pytest_cache/**"
    - "**/*.pyc"
    - "**/desktop.ini"
  content_classes:
    - "secrets"
    - "tokens"
    - "raw external-system payloads"
    - "raw account or customer payloads"
    - "raw validation artifacts"
    - "raw local logs"
    - "local databases"
    - "private identifiers"

entry_schema:
  required_fields:
    - "path"
    - "priority"
    - "authority"
    - "status"
    - "layer"
    - "task_profiles"
    - "default_retrieval_mode"
    - "canonical_purpose"
    - "mutation_boundary"
  priority_values:
    P0: "Startup, source-authority, or active-priority docs that commonly gate agent behavior."
    P1: "Task-triggered layer entrypoints and governance files used after scope classification."
    P2: "Deeper task references and supporting docs."
  retrieval_modes:
    startup_required: "Read when AGENTS.md or the active prompt requires the repository startup anchor."
    startup_optional: "Useful for onboarding, but not required when AGENTS.md defines a narrower startup read set."
    task_triggered: "Read only when the task profile matches this layer."
    trigger_only: "Read only after explicit owner scope or a matching task trigger with include_triggered."
    secondary_memory_triggered: "Read only for Project Map, source-authority, retrieval-routing, memory-update, or drift-analysis tasks."
    never_default: "Do not read by default; use only for audit, repair, or explicit scope."

task_profiles:
  startup:
    description: "Common source-authority and current-status startup context."
  docs_governance:
    description: "Documentation lifecycle, link lifecycle, reachability, and status/freshness repair."
  context_governance:
    description: "Context index, retrieval receipts, context helper, and context-selection smoke checks."
  project_map_governance:
    description: "Project Map source authority, permission, retrieval, lifecycle, memory-update, or drift work."
  review:
    description: "Read-only inspection of changed files, diffs, or scoped risks unless fixes are explicitly requested."
  planning:
    description: "Task shaping, proposed deltas, and implementation planning without mutation unless explicitly scoped."
  implementation:
    description: "Scoped code/test/docs changes after startup context and relevant specs are read."
  validation:
    description: "Local validation workflow and sanitized validation summaries."
  research:
    description: "Non-runtime evidence collection, research synthesis, and promotion candidates."
  api_agent_design:
    description: "Future API-agent context-service design, request envelope, tool gates, and receipts."

entries:
  - path: "AGENTS.md"
    priority: "P0"
    authority: "machine_first_repository_entrypoint"
    status: "active"
    layer: "root_entrypoint"
    task_profiles: [startup, docs_governance, context_governance, project_map_governance, review, planning, implementation, validation, research, api_agent_design]
    default_retrieval_mode: "startup_required"
    canonical_purpose: "Defines active priority, startup read order, task-local scope gate, and forbidden scope expansions for agents."
    mutation_boundary: "Edit only for repository-wide agent bootstrap rules; does not authorize runtime, external-system, data, or Project Map changes."

  - path: "docs/NEXT_STEPS.md"
    priority: "P0"
    authority: "primary_operational_handoff"
    status: "active"
    layer: "governance"
    task_profiles: [startup, docs_governance, planning, implementation, validation]
    default_retrieval_mode: "startup_required"
    canonical_purpose: "Defines current active priority, next safe step, task order, deferred tracks, evidence/read-set refs, and explicit non-goals."
    mutation_boundary: "Update for task-order or current-priority changes; does not override explicit task-local scope."

  - path: "docs/source_of_truth_hierarchy.md"
    priority: "P0"
    authority: "source_authority_policy"
    status: "active"
    layer: "governance"
    task_profiles: [startup, docs_governance, context_governance, project_map_governance, review, planning, implementation, research, api_agent_design]
    default_retrieval_mode: "startup_required"
    canonical_purpose: "Defines authority tiers, navigation order, operational docs, Project Map secondary status, archive/research limits, and reachability rules."
    mutation_boundary: "Update only for source-authority or navigation changes; operational docs remain above secondary memory."

  - path: "docs/context_packs/current_status.md"
    priority: "P0"
    authority: "compact_current_status"
    status: "active"
    layer: "context_pack"
    task_profiles: [startup, docs_governance, planning, implementation, validation, research]
    default_retrieval_mode: "startup_required"
    canonical_purpose: "Compact current-status handoff for active priority, next-step state, deferred tracks, validation state, and repository risks."
    mutation_boundary: "Summary only; does not override deeper source-of-truth docs."

  - path: "docs/context_governance_rules.md"
    priority: "P0"
    authority: "docs_context_governance_rule"
    status: "active"
    layer: "governance"
    task_profiles: [docs_governance, context_governance, project_map_governance, review, planning, api_agent_design]
    default_retrieval_mode: "task_triggered"
    canonical_purpose: "Defines task-local scope gate, minimal retrieval discipline, docs lifecycle, link lifecycle, session-context promotion, and next-step impact promotion rules."
    mutation_boundary: "Governance only; no runtime, Project Map memory, external-system, database, commit, push, deployment, or product scope expansion."

  - path: "docs/rules/ai_development_rules.md"
    priority: "P1"
    authority: "active_ai_workflow_rule"
    status: "active"
    layer: "ai_workflow_rules"
    task_profiles: [docs_governance, context_governance, review, planning, implementation]
    default_retrieval_mode: "task_triggered"
    canonical_purpose: "Defines AI-assisted repository workflow, required pre-change steps, context rules, and hard constraints."
    mutation_boundary: "Workflow/process rules only; does not grant runtime, external-system, data, or Project Map mutation authority."

  - path: "docs/rules/codex_prompt_rules.md"
    priority: "P1"
    authority: "active_codex_prompt_rule"
    status: "active"
    layer: "ai_workflow_rules"
    task_profiles: [context_governance, review, planning, implementation, api_agent_design]
    default_retrieval_mode: "task_triggered"
    canonical_purpose: "Defines bounded Codex prompt structure, explicit scope/out-of-scope sections, selected read sets, checks, and report-back expectations."
    mutation_boundary: "Prompt-rule changes only; does not authorize reading the whole repository or expanding task scope."

  - path: "docs/project_map/context_index.yaml"
    priority: "P0"
    authority: "navigation_metadata"
    status: "active_baseline"
    layer: "project_map"
    task_profiles: [context_governance, project_map_governance, api_agent_design]
    default_retrieval_mode: "task_triggered"
    canonical_purpose: "Machine-readable routing metadata for conservative P0/P1 context selection."
    mutation_boundary: "Navigation metadata only; entries do not create source authority or mutation permission."

  - path: "docs/project_map/README.md"
    priority: "P1"
    authority: "project_map_entrypoint"
    status: "active"
    layer: "project_map"
    task_profiles: [project_map_governance, context_governance]
    default_retrieval_mode: "secondary_memory_triggered"
    canonical_purpose: "Explains Project Map role, secondary-memory authority, file list, update rules, and mutation boundaries."
    mutation_boundary: "Project Map updates require explicit memory-update scope or an approved proposed delta."

  - path: "docs/project_map/source_authority.yaml"
    priority: "P1"
    authority: "project_map_authority_model"
    status: "active"
    layer: "project_map"
    task_profiles: [project_map_governance, context_governance]
    default_retrieval_mode: "secondary_memory_triggered"
    canonical_purpose: "Defines Project Map authority order and prevents secondary memory from becoming operational source-of-truth."
    mutation_boundary: "Advisory governance only; update only under scoped governance work."

  - path: "docs/project_map/permissions_policy.yaml"
    priority: "P1"
    authority: "project_map_permission_model"
    status: "active"
    layer: "project_map"
    task_profiles: [project_map_governance, context_governance]
    default_retrieval_mode: "secondary_memory_triggered"
    canonical_purpose: "Defines advisory intent classes, mutation gates, always-forbidden actions, and side-effect receipt expectations."
    mutation_boundary: "Advisory only; does not technically enforce permissions or grant mutation authority."

  - path: "docs/project_map/retrieval_policy.yaml"
    priority: "P1"
    authority: "project_map_retrieval_policy"
    status: "active"
    layer: "project_map"
    task_profiles: [project_map_governance, context_governance]
    default_retrieval_mode: "secondary_memory_triggered"
    canonical_purpose: "Defines retrieval hard gates, task-type entrypoints, and result requirements for Project Map secondary-memory retrieval."
    mutation_boundary: "Retrieval policy only; cannot override AGENTS.md required read order or source-of-truth hierarchy."

  - path: "docs/project_map/working_state.yaml"
    priority: "P1"
    authority: "secondary_working_state_pointer"
    status: "active_verify_against_operational_docs"
    layer: "project_map"
    task_profiles: [project_map_governance, planning, review]
    default_retrieval_mode: "secondary_memory_triggered"
    canonical_purpose: "Compact machine-readable pointer to current priority and drift markers."
    mutation_boundary: "Never use as higher authority than operational docs; edit only under memory-update or approved-delta scope."

  - path: "docs/project_map/current_map.md"
    priority: "P1"
    authority: "secondary_owner_memory"
    status: "active"
    layer: "project_map"
    task_profiles: [project_map_governance, planning, review]
    default_retrieval_mode: "secondary_memory_triggered"
    canonical_purpose: "Owner-memory and handoff map for facts, decisions, hypotheses, risks, open questions, and drift notes."
    mutation_boundary: "Secondary memory only; edit only with explicit memory-update scope or approved proposed delta."

  - path: "docs/validation/README.md"
    priority: "P1"
    authority: "validation_navigation_index"
    status: "active"
    layer: "validation"
    task_profiles: [validation, review, planning]
    default_retrieval_mode: "task_triggered"
    canonical_purpose: "Entry point for local validation runs, artifacts, review notes, cadence, and validation boundaries."
    mutation_boundary: "Validation navigation only; does not imply runtime scheduler, public launch, external-system execution, or production behavior changes."

  - path: "docs/research/README.md"
    priority: "P1"
    authority: "research_directory_index"
    status: "active"
    layer: "research"
    task_profiles: [research, planning, review]
    default_retrieval_mode: "task_triggered"
    canonical_purpose: "Directory index and classification table for research files."
    mutation_boundary: "Research routing only; does not authorize runtime, product, external-system, data, or user-facing behavior changes."
